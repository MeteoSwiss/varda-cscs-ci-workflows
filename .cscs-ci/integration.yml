# .cscs-ci/integration.yml — this repository's own cscs-ci pipeline "integration".
# Runs automatically on every PR to main and every push to main; its result is
# the `cscs/integration` status that branch protection requires.
#
# v1/.ci-ext-mch.yml, which holds every block, is included with `include:
# local`, and its nested include of cluster.yml switches to local inside this
# project too, so the pipeline tests the commit under review, never main.
#
# All jobs on `.baremetal-runner-mch` — the cluster cluster.yml names, i.e. the
# one every consumer is on. `selftest` runs the shell, env, uenv and uv blocks
# end to end — uv install, a uv sync on a dependency-free fixture project on a
# uv-managed Python — then checks it landed on that cluster. A PR that switches
# cluster.yml therefore tests the new cluster before anyone is moved to it.
#
# `exit-code-probe` and `exit-code-verify` check that a job using
# .mch-cleanup-on-exit still fails when its script fails: the block's EXIT trap
# must not swallow the runner's own, which reports the exit code.

include:
  - local: '/v1/.ci-ext-mch.yml'

stages:
  - test
  - verify

selftest:
  extends: [.baremetal-runner-mch]
  stage: test
  variables:
    SLURM_TIMELIMIT: '00:10:00'
    MCH_WORK_NAME: 'mch-recipes-selftest'
    MCH_UENV_IMAGE: 'fdb/5.21:v2'
  script:
    - !reference [.mch-sh-preamble, script]
    - !reference [.mch-log-ci-context, script]
    - !reference [.mch-env-paths, script]
    - !reference [.mch-cleanup-on-exit, script]
    - |
      banner "Check the runner's EXIT trap is kept"
      echo "runner's EXIT trap: ${mch_prev_exit_trap:-<none>}"
      test -n "$mch_prev_exit_trap" || { echo "runner set no EXIT trap — nothing to chain" >&2; exit 1; }
    - !reference [.mch-log-tool-versions, script]
    - !reference [.mch-pull-uenv, script]
    - !reference [.mch-install-uv, script]
    - |
      cp -r "$CI_PROJECT_DIR/tests/fixture" "$WORK/fixture"
      cd "$WORK/fixture"
    - !reference [.mch-uv-sync, script]
    - |
      banner "Check the venv's Python"
      # uv-managed (not the node's /usr/bin/python3) and ships its headers —
      # the reason .mch-install-uv defaults UV_PYTHON_PREFERENCE=only-managed.
      uv run python - <<'PY'
      import os, sys, sysconfig
      base = os.path.realpath(sys.base_prefix)
      header = os.path.join(sysconfig.get_paths()["include"], "Python.h")
      print(f"python {sys.version.split()[0]} at {base}")
      assert not base.startswith("/usr"), f"system python in use: {base}"
      assert os.path.exists(header), f"no {header}"
      PY
    - !reference [.mch-assert-cluster, script]
    - !reference [.mch-cleanup, script]

# Must FAIL, with exit code 42 — that one failure is allowed, so the pipeline
# passes with a warning. The marker is uploaded only if the runner saw the job
# fail (artifacts:when on_failure); were the exit code swallowed, the job would
# show green, upload nothing, and exit-code-verify would fail.
exit-code-probe:
  extends: [.baremetal-runner-mch]
  stage: test
  allow_failure:
    exit_codes: [42]
  artifacts:
    when: on_failure
    paths: [probe-failed]
  variables:
    GIT_STRATEGY: 'none'
    SLURM_TIMELIMIT: '00:05:00'
    MCH_WORK_NAME: 'mch-recipes-probe'
  script:
    - !reference [.mch-sh-preamble, script]
    - !reference [.mch-env-paths, script]
    - !reference [.mch-cleanup-on-exit, script]
    - |
      banner "Fail on purpose (exit 42)"
      touch "$CI_PROJECT_DIR/probe-failed"
      exit 42

exit-code-verify:
  extends: [.baremetal-runner-mch]
  stage: verify
  needs:
    - job: exit-code-probe
      artifacts: true
  variables:
    GIT_STRATEGY: 'none'
    SLURM_TIMELIMIT: '00:05:00'
  script:
    - |
      test -f "$CI_PROJECT_DIR/probe-failed" \
        || { echo "exit-code-probe exited 42 but the runner reported success" >&2; exit 1; }
      echo "exit-code-probe was reported failed, as it should be"
