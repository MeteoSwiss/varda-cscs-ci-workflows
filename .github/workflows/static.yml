name: Static checks

# Required by branch protection on main, next to cscs-ci's `cscs/integration`.
# Every consumer follows main, so nothing merges unless these pass.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx yamllint --strict .

  schema:
    name: gitlab-ci schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Per file, plus each example merged with the blocks: GitLab's JSON schema
      # for CI files, with `!reference` understood (--data-transform gitlab-ci).
      - run: |
          for f in examples/*.yml; do
            tests/flatten.sh "$f" > "$RUNNER_TEMP/$(basename "$f" .yml).merged.yml"
          done
          uvx check-jsonschema --builtin-schema vendor.gitlab-ci --data-transform gitlab-ci \
            --regex-variant nonunicode \
            cluster.yml v1/.ci-ext-mch.yml .cscs-ci/*.yml examples/*.yml \
            "$RUNNER_TEMP"/*.merged.yml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # shellcheck and yq (mikefarah v4) are preinstalled on ubuntu-latest.
      - run: tests/shellcheck.sh

  includes:
    name: includes on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Every URL to this repository names main, and .ci-ext-mch.yml's local and
      # remote includes match. yq (mikefarah v4) is preinstalled on ubuntu-latest.
      - run: tests/includes.sh

  gitlab-lint:
    name: gitlab lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: GitLab CI lint of the example consumers
        env:
          GITLAB_LINT_TOKEN: ${{ secrets.GITLAB_LINT_TOKEN }}
          GITLAB_LINT_PROJECT_ID: ${{ vars.GITLAB_LINT_PROJECT_ID }}
        run: |
          # Secrets are not passed to PRs from forks; the token-free jobs still run.
          if [ -z "$GITLAB_LINT_TOKEN" ] || [ -z "$GITLAB_LINT_PROJECT_ID" ]; then
            echo "::warning::GITLAB_LINT_TOKEN / GITLAB_LINT_PROJECT_ID not available — skipped"
            exit 0
          fi
          for f in examples/*.yml; do tests/gitlab-lint.sh "$f"; done

  merged:
    name: merged pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Token-free check that `extends` and `!reference` resolve across the
      # merged files: gitlab-ci-local builds the pipeline and lists its jobs.
      - run: |
          for f in examples/*.yml; do
            echo "== $f"
            tests/flatten.sh "$f" > .gitlab-ci-merged.yml
            npx --yes gitlab-ci-local@4 --file .gitlab-ci-merged.yml --list
          done

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The GitHub workflows, the reusable trigger-cscs-ci.yml among them; their
      # run: blocks go through the preinstalled shellcheck.
      - run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
