# v1/.ci-ext-mch.yml — the one file a consumer includes:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/MeteoSwiss/varda-cscs-ci-workflows/main/v1/.ci-ext-mch.yml'
#
# It pulls in cscs-ci's own templates, the cluster switch (../cluster.yml) and
# every v1 building block (shell.yml, env.yml, uenv.yml, uv.yml), and defines the
# runners.
#
# Nested includes of a remotely included file cannot be `local` (they would
# resolve in the *consumer's* project), so each of our files is included twice
# behind mutually exclusive rules: `local` inside this repository's own pipeline
# — the integration test then exercises the PR commit, not main — and `remote`
# from main everywhere else. cscs-ci's .ci-ext.yml uses the same trick.

# CI_PROJECT_ID of this repository's mirror on the cscs-ci GitLab. Until it is
# filled in, the rule never matches and the remote copies (main) are used.
.mch-self-project:
  rules: &mch-self
    - if: '$CI_PROJECT_ID == "0"'
.mch-other-project:
  rules: &mch-other
    - if: '$CI_PROJECT_ID != "0"'

include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'
  - local: '/cluster.yml'
    rules: *mch-self
  - remote: 'https://raw.githubusercontent.com/MeteoSwiss/varda-cscs-ci-workflows/main/cluster.yml'
    rules: *mch-other
  - local: '/v1/shell.yml'
    rules: *mch-self
  - remote: 'https://raw.githubusercontent.com/MeteoSwiss/varda-cscs-ci-workflows/main/v1/shell.yml'
    rules: *mch-other
  - local: '/v1/env.yml'
    rules: *mch-self
  - remote: 'https://raw.githubusercontent.com/MeteoSwiss/varda-cscs-ci-workflows/main/v1/env.yml'
    rules: *mch-other
  - local: '/v1/uenv.yml'
    rules: *mch-self
  - remote: 'https://raw.githubusercontent.com/MeteoSwiss/varda-cscs-ci-workflows/main/v1/uenv.yml'
    rules: *mch-other
  - local: '/v1/uv.yml'
    rules: *mch-self
  - remote: 'https://raw.githubusercontent.com/MeteoSwiss/varda-cscs-ci-workflows/main/v1/uv.yml'
    rules: *mch-other

# ── runners ──────────────────────────────────────────────────────────────────

# What every MeteoSwiss bare-metal job shares. Built on cscs-ci's generic
# `.f7t-baremetal-runner` (the way cscs-ci defines its own beverin and starlex
# runners), so nothing santis-specific is inherited. Not meant to be extended
# directly: it does not say which cluster to land on.
.mch-baremetal-base:
  extends: [.f7t-baremetal-runner]
  variables:
    F7T_URL: 'https://api.cscs.ch/mch/firecrest/v2'
    ARCH: 'x86_64'
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 1

# The default: whichever cluster ../cluster.yml currently names.
.baremetal-runner-mch:
  extends: [.mch-baremetal-base, .mch-cluster]

# For jobs that must stay on one cluster whatever cluster.yml says.
.baremetal-runner-mch-balfrin:
  extends: [.mch-baremetal-base]
  variables:
    FIRECREST_SYSTEM: 'balfrin'

.baremetal-runner-mch-linard:
  extends: [.mch-baremetal-base]
  variables:
    FIRECREST_SYSTEM: 'linard'
